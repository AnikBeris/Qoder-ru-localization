name: Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'install/**'
      - 'data/**'
      - 'Build.bat'
      - 'QODER_VERSION.txt'
      - 'RELEASE_VERSION.txt'
      - 'RELEASE_NOTES-*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read versions
        id: version
        shell: pwsh
        run: |
          $app = (Get-Content -Raw QODER_VERSION.txt).Trim()
          $rel = (Get-Content -Raw RELEASE_VERSION.txt).Trim()
          if (-not $app) { throw 'QODER_VERSION.txt is empty' }
          if (-not $rel) { throw 'RELEASE_VERSION.txt is empty' }
          "app=$app" >> $env:GITHUB_OUTPUT
          "release=$rel" >> $env:GITHUB_OUTPUT
          "tag=v$rel" >> $env:GITHUB_OUTPUT

      - name: Refuse to overwrite an existing release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Error "Release $tag already exists. Bump RELEASE_VERSION.txt (for example 0.5.5-2) and push again; existing releases are never overwritten."
            exit 1
          }
          $global:LASTEXITCODE = 0

      - name: Build installer
        shell: cmd
        run: Build.bat

      - name: Package and checksums
        shell: pwsh
        run: |
          $app = "${{ steps.version.outputs.app }}"
          $rel = "${{ steps.version.outputs.release }}"
          $exe = "QoderRU-Setup-$app.exe"
          $zip = "qoder-ru-localization-$rel-windows-x64.zip"
          Compress-Archive -Path $exe -DestinationPath $zip -Force
          $lines = @(
            "$((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower())  $zip",
            "$((Get-FileHash $exe -Algorithm SHA256).Hash.ToLower())  $exe"
          )
          Set-Content -Path checksums.txt -Value $lines -Encoding utf8
          Get-Content checksums.txt

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rel = "${{ steps.version.outputs.release }}"
          $tag = "${{ steps.version.outputs.tag }}"
          $notes = "RELEASE_NOTES-$tag.md"
          if (-not (Test-Path $notes)) { throw "Missing $notes" }
          gh release create $tag --repo $env:GITHUB_REPOSITORY --title $tag --notes-file $notes "qoder-ru-localization-$rel-windows-x64.zip" checksums.txt
